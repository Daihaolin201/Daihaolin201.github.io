<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>Page not found · Donglin (Dennis) Li</title>
    <style>
      :root { --bg: #060b18; --panel: #0f1b30; --text: #eaf0ff; --muted: #a6b6d6; --accent: #22d3ee; --on-accent: #04121c; --edge: #24354f; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      @media (prefers-color-scheme: light) { :root { --bg: #eef3fb; --panel: #ffffff; --text: #0f1c33; --muted: #46597a; --accent: #0e7490; --on-accent: #ffffff; --edge: rgba(30, 64, 120, .14); } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font: 16px/1.6 var(--sans); background: var(--bg); color: var(--text); }
      main { max-width: 560px; width: 100%; padding: 2rem; border-radius: 16px; border: 1px solid var(--edge); background: var(--panel); }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1rem; color: var(--muted); }
      .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
      a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 1rem; border-radius: 9px; border: 1px solid var(--edge); color: var(--text); text-decoration: none; font-weight: 600; font-size: .9rem; }
      a.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found / 页面未找到</h1>
      <p>This GitHub Pages site only hosts the canonical identity verification page. The full website lives at donglinli.com.</p>
      <div class="actions">
        <a class="primary" href="https://donglinli.com/">donglinli.com</a>
        <a href="/">Verification (EN)</a>
        <a href="/zh/">身份核验 (中文)</a>
      </div>
    </main>
  </body>
</html>
